# Spike front proxy: optional HTTP Basic auth + CORS in front of QGIS Server (FCGI).
#  /ogc/spike/...      -> CORS added by nginx (preflight answered here, 204)
#  /raw/ogc/spike/...  -> same, but NO CORS handling (everything incl. OPTIONS reaches QGIS)
# Anonymous requests (no Authorization header) are let through; requests WITH an
# Authorization header must carry valid credentials (else nginx 401).
# The authenticated user name is passed to QGIS only as the CGI param REMOTE_USER;
# a client-sent X-Qgis-User header is blanked so it cannot be spoofed.
worker_processes 1;
events { worker_connections 256; }
http {
    access_log /dev/stdout;
    error_log  stderr info;
    client_max_body_size 10m;

    map $http_authorization $auth_realm {
        ""      off;
        default "QGIS spike";
    }
    map $http_host $port { "~*.*:(?<p>.*)" $p; default $server_port; }
    map $qgis_project $qgis_project_file {
        "~(?<qgis_project_name>[^/]+)$" /io/data/$qgis_project/$qgis_project_name.qgs;
        default "";
    }
    upstream qgis-fcgi { server qgis-server:9993; }

    server {
        listen 80;
        auth_basic           $auth_realm;
        auth_basic_user_file /etc/nginx/htpasswd;

        location /ogc/ {
            set $preflight "";
            if ($request_method = OPTIONS) { set $preflight "O"; }
            if ($http_access_control_request_method) { set $preflight "${preflight}P"; }
            if ($preflight = "OP") {
                add_header Access-Control-Allow-Origin $http_origin always;
                add_header Access-Control-Allow-Methods "GET, HEAD, POST, PUT, PATCH, DELETE, OPTIONS" always;
                add_header Access-Control-Allow-Headers $http_access_control_request_headers always;
                add_header Access-Control-Allow-Credentials "true" always;
                add_header Access-Control-Max-Age 600 always;
                add_header Vary "Origin" always;
                return 204;
            }
            # actual requests: CORS headers are added in /qgis/ (add_header does not survive the rewrite)
            set $cors_origin $http_origin;
            rewrite ^/ogc/(?<qgis_project>.+?)/?(/(ogcapi|wfs3)(/.*)?)?$ /qgis/qgis_mapserv.fcgi last;
        }
        location /raw/ogc/ {
            set $cors_origin "";
            rewrite ^/raw/ogc/(?<qgis_project>.+?)/?(/(ogcapi|wfs3)(/.*)?)?$ /qgis/qgis_mapserv.fcgi last;
        }
        location /qgis/ {
            internal;
            set $cors_creds "";
            set $cors_expose "";
            if ($cors_origin) { set $cors_creds "true"; set $cors_expose "Location, ETag, Allow, Accept-Post, Accept-Patch, Content-Crs, WWW-Authenticate"; }
            add_header Access-Control-Allow-Origin $cors_origin always;
            add_header Access-Control-Allow-Credentials $cors_creds always;
            add_header Access-Control-Expose-Headers $cors_expose always;
            fastcgi_pass  qgis-fcgi;
            fastcgi_param SCRIPT_FILENAME /usr/lib/cgi-bin/qgis_mapserv.fcgi;
            fastcgi_param QUERY_STRING    $query_string;
            fastcgi_param SERVER_NAME     $host;
            fastcgi_param SERVER_PORT     $port;
            fastcgi_param REQUEST_URI     $request_uri;
            fastcgi_param REMOTE_USER     $remote_user;
            fastcgi_param HTTP_X_QGIS_USER "";
            fastcgi_param QGIS_PROJECT_FILE $qgis_project_file if_not_empty;
            include fastcgi_params;   # last: for duplicated params the first one wins
        }
    }
}
