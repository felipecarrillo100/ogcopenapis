name: ogcopenapis-write-qgis
services:
  postgis:
    image: postgis/postgis:17-3.5@sha256:01a6a70e41e6c4467c8f55f6063555ed72db2d6662cd0d571040d42eadaeb6f6
    # amd64 only, emulated on Apple Silicon
    platform: linux/amd64
    container_name: write-qgis-postgis
    environment:
      POSTGRES_USER: gis
      POSTGRES_PASSWORD: gis
      POSTGRES_DB: gis
    ports:
      - "5437:5432"   # 5436 was taken by the ldproxy spike when this was set up
    volumes:
      - ./sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gis -d gis"]
      interval: 5s
      retries: 20

  # Official QGIS Server image, newest official release (LR) at 2026-11-09.
  # amd64 only -> runs emulated on Apple Silicon.
  qgis-server:
    image: qgis/qgis-server:4.2.3@sha256:3030bfd079f33bdcf63dde777584c01bc8b9bce61604c2a609659ca2419e6749
    platform: linux/amd64
    container_name: write-qgis-qgis
    restart: unless-stopped   # see FINDINGS: a PUT that changes the PK segfaults qgis_mapserv
    depends_on:
      postgis:
        condition: service_healthy
    environment:
      SKIP_NGINX: "true"          # our own nginx (auth + CORS) is in front, FCGI on 9993
      QGIS_SERVER_LOG_LEVEL: "0"
      QGIS_SERVER_LOG_STDERR: "true"
      QGIS_PLUGINPATH: /io/plugins
      QGIS_SERVER_MAX_THREADS: "2"
    command: ["/bin/bash", "/scripts/start-qgis.sh"]
    volumes:
      - ./project:/io/data:ro
      - ./plugins:/io/plugins:ro
      - ./scripts:/scripts:ro

  nginx:
    image: nginx:1.27-alpine@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
    container_name: write-qgis-nginx
    depends_on:
      - qgis-server
    ports:
      - "8086:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/htpasswd:/etc/nginx/htpasswd:ro
