# SPIKE reverse proxy in front of pygeoapi
#  - reads (GET/HEAD/OPTIONS) anonymous
#  - writes (POST/PUT/PATCH/DELETE) need HTTP Basic; user "viewer" gets 403
#  - CORS for http://localhost:5173 (and 127.0.0.1:5173) with credentials;
#    pygeoapi's own CORS headers are hidden.
# NOTE: every POST is treated as a write, including pygeoapi's
#       POST /items CQL2 search (a read).

# keyed on the ORIGINAL method forwarded by /_authz (see server 8081)
map $http_x_original_method $write_realm {
    POST    "pygeoapi spike writes";
    PUT     "pygeoapi spike writes";
    PATCH   "pygeoapi spike writes";
    DELETE  "pygeoapi spike writes";
    default off;
}

map "$request_method:$http_access_control_request_method" $is_preflight {
    "~^OPTIONS:.+" 1;
    default        0;
}

map $http_origin $cors_origin {
    "http://localhost:5173"  $http_origin;
    "http://127.0.0.1:5173"  $http_origin;
    default "";
}
map $cors_origin $cors_credentials {
    ""      "";
    default "true";
}

# used by the internal role-check server (port 8082)
map "$http_x_original_method:$remote_user" $authz_deny {
    "~^(POST|PUT|PATCH|DELETE):viewer$" 1;
    default 0;
}

upstream pygeoapi { server pygeoapi:80; }

server {
    listen 80;
    server_name _;
    client_max_body_size 20m;

    location / {
        if ($is_preflight) {
            add_header Access-Control-Allow-Origin      $cors_origin always;
            add_header Access-Control-Allow-Credentials $cors_credentials always;
            add_header Access-Control-Allow-Methods     "GET, HEAD, POST, PUT, PATCH, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers     "Authorization, Content-Type, Content-Crs, Accept, If-Match, If-None-Match, Prefer" always;
            add_header Access-Control-Max-Age           600 always;
            add_header Vary                             "Origin" always;
            return 204;
        }

        auth_request /_authz;

        proxy_pass http://pygeoapi;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-User $remote_user;

        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Credentials;
        proxy_hide_header Access-Control-Expose-Headers;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Headers;
        proxy_hide_header Vary;

        add_header Access-Control-Allow-Origin      $cors_origin always;
        add_header Access-Control-Allow-Credentials $cors_credentials always;
        add_header Access-Control-Expose-Headers    "Location, ETag, Allow, Content-Crs, Content-Type, WWW-Authenticate, Link" always;
        add_header Vary                             "Origin" always;
    }

    # auth_request subrequests skip nginx's access phase, so auth_basic cannot
    # live here; the subrequest is proxied to a separate internal server.
    location = /_authz {
        internal;
        proxy_pass              http://127.0.0.1:8081/;
        proxy_pass_request_body off;
        proxy_set_header        Content-Length "";
        proxy_set_header        X-Original-Method $request_method;
    }
}

# authentication: HTTP Basic, only for write methods (401 + WWW-Authenticate)
server {
    listen 127.0.0.1:8081;
    location / {
        auth_basic           $write_realm;
        auth_basic_user_file /etc/nginx/htpasswd;
        proxy_pass           http://127.0.0.1:8082;
        proxy_set_header     X-Original-Method $http_x_original_method;
    }
}

# authorization: user "viewer" may not write (403)
server {
    listen 127.0.0.1:8082;
    location / {
        if ($authz_deny) { return 403; }
        return 204;
    }
}
