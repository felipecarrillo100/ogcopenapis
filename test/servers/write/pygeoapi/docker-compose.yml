# Write test server: pygeoapi 0.24.0 + PostGIS + nginx (Basic auth for writes, CORS)
# Images pinned by tag AND digest (spikes/pygeoapi-postgis/FINDINGS.md).
name: ogcopenapis-write-pygeoapi

services:
  postgis:
    image: postgis/postgis:18-3.7@sha256:440bdd14e3edccfce04d080d8a1a0cbae5763fa16a1c4172bff83530828461de
    # postgis/postgis publishes linux/amd64 only; runs emulated on Apple Silicon
    platform: linux/amd64
    container_name: write-pygeoapi-postgis
    environment:
      POSTGRES_DB: spike
      POSTGRES_USER: spike
      POSTGRES_PASSWORD: spike
    ports:
      - "${SPIKE_PG_PORT:-5434}:5432"
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U spike -d spike"]
      interval: 3s
      timeout: 3s
      retries: 20

  pygeoapi:
    image: geopython/pygeoapi:0.24.0@sha256:a62895f2585ef1fcd1fc97ec35bf13177becc1334a622172a2c5c4d2145b8f0a
    container_name: write-pygeoapi
    restart: on-failure
    depends_on:
      postgis:
        condition: service_healthy
    environment:
      PYGEOAPI_CONFIG: /pygeoapi/spike.config.yml
      PYGEOAPI_OPENAPI: /pygeoapi/spike.openapi.yml
      # pygeoapi has ONE public URL; it is the proxy's (links/Location use it)
      PYGEOAPI_SERVER_URL: "http://localhost:${SPIKE_PROXY_PORT:-5002}"
      WSGI_WORKERS: "2"
    ports:
      - "${SPIKE_PYGEOAPI_PORT:-5011}:80"
    volumes:
      - ./pygeoapi/spike.config.yml:/pygeoapi/spike.config.yml:ro

  proxy:
    image: nginx:1.30.6-alpine@sha256:583b7f2fce1cdb8da5ad5c39ebd3c33b98b87d493190e548bdee1fa8c619c311
    container_name: write-pygeoapi-proxy
    depends_on:
      - pygeoapi
    ports:
      - "${SPIKE_PROXY_PORT:-5002}:80"
    volumes:
      - ./proxy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./proxy/htpasswd:/etc/nginx/htpasswd:ro
